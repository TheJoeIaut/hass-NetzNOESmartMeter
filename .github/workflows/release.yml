name: Release

# Three ways to release, all ending with a published release and netznoe.zip:
# - run this workflow by hand with a tag such as v0.8.3: the tag is created
#   on the commit the run is for (usually main),
# - push a tag such as v0.8.3,
# - publish a release in the GitHub UI: the zip is attached to it.
# New releases get notes generated from the merged pull requests.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.8.3"
        required: true
        type: string
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check the tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not of the form v1.2.3"
            exit 1
          fi

      - name: Set the version from the tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 manage/update_manifest.py --version "${TAG#v}"

      - name: Zip the integration
        working-directory: custom_components/netznoe
        run: zip -r netznoe.zip ./

      - name: Publish the release with the zip attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          ZIP: custom_components/netznoe/netznoe.zip
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber --repo "$GITHUB_REPOSITORY"
          else
            # On a manual run the tag does not exist yet and is created on the
            # commit being built; on a tag push it already points there.
            gh release create "$TAG" "$ZIP" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          fi
