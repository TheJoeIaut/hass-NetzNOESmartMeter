name: Release

# Pushing a tag such as v0.8.3 builds netznoe.zip and publishes the release
# for that tag, with notes generated from the merged pull requests.
# A release published by hand in the GitHub UI still works: the job then only
# builds the zip and attaches it to that release.
on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set the version from the tag
        env:
          TAG: ${{ github.ref_name }}
        run: python3 manage/update_manifest.py --version "${TAG#v}"

      - name: Zip the integration
        working-directory: custom_components/netznoe
        run: zip -r netznoe.zip ./

      - name: Publish the release with the zip attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ZIP: custom_components/netznoe/netznoe.zip
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$ZIP" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --generate-notes --verify-tag
          fi
